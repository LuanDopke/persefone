# GitHub Project (v2) destination for Spec Kit task publication.
project:
  owner: "LuanDopke"
  number: 1

# Create draft cards only. No GitHub issues are created by this configuration.
mode: "draft"

status_field: "Status"
default_status: "Done"
done_status: "Done"

# Populate this field when the Project has options such as P1, P2 and P3.
priority_field: "Priority"

add_labels: true
skip_completed: false
only_stories: []
